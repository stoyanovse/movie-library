services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-movie_library}
      MARIADB_USER: ${DB_USER:-movielibrary}
      MARIADB_PASSWORD: ${DB_PASSWORD:-movielibrary}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    dns: [8.8.8.8, 1.1.1.1]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:

      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-movie_library}
      DB_USERNAME: ${DB_USER:-movielibrary}
      DB_PASSWORD: ${DB_PASSWORD:-movielibrary}
      OMDB_API_KEY: ${OMDB_API_KEY}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  db_data:
